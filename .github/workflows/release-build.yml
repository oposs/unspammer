name: Release build

# Called by Create release PR on the release branch before the pull request
# exists (D28). The repo-infra release pieces build the archives, the deb and
# rpm packages from the static Linux archives, and the bottle with the
# rewritten Formula/unspammer.rb (D32). Read-only: nothing here writes the
# repository.
on:
  workflow_call:
    inputs:
      version:
        description: The version being released.
        type: string
        required: true
      ref:
        description: The release branch head to build.
        type: string
        required: true

permissions:
  contents: read

jobs:
  binaries:
    uses: oposs/repo-infra/.github/workflows/ri-release-go-binaries.yml@feat/ri-release-go-binaries
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      bin: unspammer
      package: ./cmd

  packages:
    needs: binaries
    uses: oposs/repo-infra/.github/workflows/ri-release-nfpm.yml@v2
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      config: nfpm.yaml
      packagers: '{"deb": {}, "rpm": {}}'
      archives: x86_64-unknown-linux-musl aarch64-unknown-linux-musl

  homebrew:
    needs: binaries
    uses: oposs/repo-infra/.github/workflows/ri-release-homebrew.yml@v2
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      bin: unspammer
