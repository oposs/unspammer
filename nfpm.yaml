# The .deb and .rpm of unspammer, built by ri-release-nfpm from the static
# Linux archives. The piece fills in VERSION, MTIME and ARCH, and STAGE, the
# unpacked unspammer/ folder of one archive, before nfpm reads this file.
# Write no dollar-brace name in a comment either: the piece fills in the whole
# file and stops at a name it does not know. The binary is built without cgo
# and depends on nothing.
name: unspammer
arch: "${ARCH}"
platform: linux
version: "${VERSION}"
release: "1"
mtime: "${MTIME}"
section: mail
priority: optional
maintainer: Tobias Oetiker <tobi@oetiker.ch>
license: GPL-3.0
description: |
  IMAP robot that acts on mail arriving in watched folders
  Watches IMAP folders and acts on new mail: removes SpamAssassin headers,
  stores an edited copy in another folder, forwards it by SMTP or adds a
  running ticket number to the subject. A single static binary.
contents:
  - src: ${STAGE}/unspammer
    dst: /usr/bin/unspammer
    file_info:
      mode: 0755
  - src: ${STAGE}/man/unspammer.8.gz
    dst: /usr/share/man/man8/unspammer.8.gz
    file_info:
      mode: 0644
  - src: ${STAGE}/README.md
    dst: /usr/share/doc/unspammer/README.md
    file_info:
      mode: 0644
  - src: ${STAGE}/LICENSE
    dst: /usr/share/doc/unspammer/copyright
    packager: deb
    file_info:
      mode: 0644
  - src: ${STAGE}/LICENSE
    dst: /usr/share/doc/unspammer/LICENSE
    packager: rpm
    type: doc
    file_info:
      mode: 0644
